name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.tools }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        tools: [all]
        include:
          - { os: ubuntu-latest, tools: 'jaic,jaifmt,jailint' }
          - { os: windows-latest, tools: 'jaic,jaifmt,jailint' }
          - { os: ubuntu-latest, tools: 'jaic' }
          - { os: ubuntu-latest, tools: 'jaic,jaifmt,jailint,jailsp', version: '0.18.0' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: jai
        uses: ./
        with:
          tools: ${{ matrix.tools }}
          version: ${{ matrix.version || 'latest' }}
      - name: Check the outputs
        shell: bash
        run: |
          echo "version=${{ steps.jai.outputs.version }} path=${{ steps.jai.outputs.path }}"
          test -n "${{ steps.jai.outputs.version }}"
          test -n "${{ steps.jai.outputs.path }}"
      - name: Version
        run: jaic --version
      - name: Hello world
        shell: bash
        run: |
          cat > hello.jai <<'JAI'
          #import "Basic";

          main :: () {
              print("hello from jai\n");
          }
          JAI
          jaic run hello.jai | tee out.txt
          grep -q "hello from jai" out.txt
      - name: Format check
        if: contains(matrix.tools, 'jaifmt') || matrix.tools == 'all'
        shell: bash
        run: jaifmt --check hello.jai
      - name: Lint
        if: contains(matrix.tools, 'jailint') || matrix.tools == 'all'
        shell: bash
        run: jailint -D warnings hello.jai
      - name: Second run uses the cache
        if: matrix.tools == 'all'
        uses: ./
        with:
          version: latest
      - name: Excluded tools are not on PATH
        if: matrix.tools == 'jaic'
        shell: bash
        run: |
          ! command -v jaifmt
          ! command -v jailint
      - name: Pinned version is installed
        if: matrix.version
        shell: bash
        run: jaic --version | grep -q "${{ matrix.version }}"
